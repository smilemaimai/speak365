<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="開口365">
<title>開口 365</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 單欄手機卡片流；首頁＝今日任務＋365 格進度牆，練習頁＝一次一張卡＋底部固定操作列 */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#14213D; --muted:#5D6785; --line:#DCE1EE;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --voice:#FF8A3D; --voice-soft:#FFE8D8;
  --good:#1E9E6A; --good-soft:#DDF4EA; --bad:#D9433B; --bad-soft:#FBE3E1; --cell:#E4E8F2;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC",system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172036; --ink:#EAF0FF; --muted:#9AA6C6; --line:#2A3654;
  --accent:#6E8DFF; --accent-ink:#0E1424; --voice:#FF9C5B; --voice-soft:#3A2618;
  --good:#3CCB8F; --good-soft:#163527; --bad:#FF6F66; --bad-soft:#3A1C1B; --cell:#222D47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172036; --ink:#EAF0FF; --muted:#9AA6C6; --line:#2A3654;
  --accent:#6E8DFF; --accent-ink:#0E1424; --voice:#FF9C5B; --voice-soft:#3A2618;
  --good:#3CCB8F; --good-soft:#163527; --bad:#FF6F66; --bad-soft:#3A1C1B; --cell:#222D47; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 16px) 120px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* 頂部 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:baseline;gap:6px}
.brand b{color:var(--voice)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}

/* 今日卡 */
.today{background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 20px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.today .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.daynum{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.03em}
.daynum small{font-size:18px;font-weight:500;opacity:.6;letter-spacing:0}
.today h2{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:500}
.chip.v{background:var(--voice);color:#1d1206}
.wave{position:absolute;right:14px;top:52px;display:flex;gap:4px;align-items:center;height:60px;opacity:.9}
.wave i{display:block;width:6px;border-radius:3px;background:var(--voice)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;font-size:17px}
.btn svg{width:22px;height:22px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.today .btn.primary{background:var(--voice);color:#1d1206}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* 進度牆 */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.sec-h h3{font-size:19px}
.months{display:grid;gap:10px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.month-h strong{font-size:15px}
.month-h span{font-size:12px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--cell);font-size:10.5px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums;max-width:100%}
.cell.done{background:var(--good);color:#fff}
.cell.done.lo{background:color-mix(in srgb,var(--good) 55%,var(--cell))}
.cell.next{outline:2px solid var(--voice);outline-offset:1px;color:var(--ink);font-weight:700}
.cell.grad{background:var(--voice-soft);color:var(--voice);font-weight:800}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 練習頁 */
.lesson-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar{flex:1;height:8px;background:var(--cell);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--voice);border-radius:99px;transition:width .3s}
.lesson-title{margin-bottom:14px}
.lesson-title h2{font-size:21px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.who{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.en{font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1.3;letter-spacing:-.01em;word-break:break-word}
.zh{font-size:16px;color:var(--muted)}
.zh.big{font-size:21px;color:var(--ink);font-weight:500}
.hidden-en{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:14px}
.w{border-radius:5px;padding:0 2px;transition:background .2s}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14.5px;font-weight:500}
.pill svg{width:18px;height:18px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.heard{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px}
.heard b{font-weight:500}
.score{display:flex;align-items:center;gap:12px}
.score .num{font-family:var(--f-display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.score.good .num{color:var(--good)} .score.mid .num{color:var(--voice)} .score.low .num{color:var(--bad)}
.tip{font-size:13.5px;color:var(--muted)}
.dialog{display:grid;gap:8px}
.line{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid transparent}
.line.B{background:var(--voice-soft)}
.line.now{border-color:var(--accent)}
.line .en{font-size:17px}
.line .zh{font-size:13.5px}
.scene{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;margin-top:8px}
.seg button{min-height:34px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.vtag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--voice-soft);color:var(--voice);letter-spacing:.04em;margin-right:6px;vertical-align:2px}
.alt{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:grid;gap:2px}
.alt .t{font-size:16px;font-weight:600;word-break:break-word}
.alt .n{font-size:13px;color:var(--muted)}
.line .alt .t{font-size:14px}
.okalt{font-size:13.5px;color:var(--good);font-weight:600}

/* 底部固定列 */
.dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.mic{width:72px;height:72px;flex:none;border-radius:50%;background:var(--voice);color:#1d1206;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--voice) 40%,transparent);position:relative}
.mic svg{width:30px;height:30px}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--voice) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.dock .btn{flex:1}
.dock-label{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}

/* 自評 */
.stars{display:flex;gap:6px}
.stars button{font-size:32px;line-height:1;color:var(--cell)}
.stars button.on{color:var(--voice)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.timer{font-family:var(--f-display);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}

/* 設定 */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:14px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{background:var(--voice-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.summary{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.big-score{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1;color:var(--voice)}

/* 等級、建議、週報、錯題本 */
.grade{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;vertical-align:middle}
.stat .grade{min-width:24px;height:24px;font-size:14px;border-radius:7px;vertical-align:4px}
.grade.gS{background:var(--voice);color:#1d1206}.grade.gA{background:var(--good);color:#fff}.grade.gB{background:var(--accent);color:var(--accent-ink)}.grade.gC{background:var(--cell);color:var(--muted)}
.tips{display:grid;gap:8px}
.tipitem{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--voice-soft);font-size:14.5px}
.tipitem b{font-weight:700}
.tipitem span{color:var(--ink);opacity:.85}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.metrics div,.rep-stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.metrics b,.rep-stats b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.metrics span,.rep-stats span{font-size:11.5px;color:var(--muted)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:22px;text-align:left}
.rep-row{display:flex;gap:12px;align-items:center}
.rep-grade .grade{min-width:56px;height:56px;font-size:30px;border-radius:14px}
.rep-stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-width:0}
b.up{color:var(--good)}b.down{color:var(--bad)}
.wtag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);margin:2px 2px 0 0;font-weight:500;letter-spacing:0;text-transform:none}
.mistcard{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:var(--r);padding:12px 14px;margin:-12px 0 22px}
.mistcard>div{min-width:0}
.mistcard .btn{min-height:44px;padding:0 16px;font-size:15px;flex:none}
.weak{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.weak:first-of-type{border-top:0}
.summary .grade{min-width:48px;height:48px;font-size:26px}
.envwarn{background:var(--bad-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-bottom:14px;display:grid;gap:2px}
.envwarn b{color:var(--bad)}
.diaglog{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;min-height:80px;margin:0 0 16px;font-family:ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="dock"></div>
<div class="toast" id="toast" hidden></div>

<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script>
(function(){
"use strict";
/* ---------- 課程結構 ---------- */
var WEEKS_PER_MONTH=[4,4,5,4,4,5,4,4,5,4,4,5];
var DAY_TYPES=[
  {k:"learn",n:"新句子 A",d:"學 4 個新句子，聽 → 跟讀 → 看分數"},
  {k:"learn",n:"新句子 B",d:"再學 4 個新句子"},
  {k:"recall",n:"中翻英挑戰",d:"看中文，直接用英文說出來"},
  {k:"listen",n:"情境對話・聽與跟讀",d:"聽完整對話，逐句跟讀"},
  {k:"roleplay",n:"角色扮演",d:"App 演對方，你接話"},
  {k:"free",n:"自由開口",d:"錄下一段自己的話，回放自評"},
  {k:"review",n:"週複習",d:"本週＋之前學過的句子混合挑戰"}
];
function weekMonth(w){var s=0;for(var i=0;i<12;i++){s+=WEEKS_PER_MONTH[i];if(w<s)return i;}return 11;}
function monthRange(m){var s=0;for(var i=0;i<m;i++)s+=WEEKS_PER_MONTH[i];var a=s*7+1,b=(s+WEEKS_PER_MONTH[m])*7;if(m===11)b=365;return[a,b];}
function dayInfo(d){
  if(d===365)return{d:d,w:51,m:11,type:{k:"grad",n:"畢業日",d:"全年總複習＋畢業演講"},week:WEEKS[51]};
  var w=Math.floor((d-1)/7),t=(d-1)%7;
  return{d:d,w:w,m:weekMonth(w),t:t,type:DAY_TYPES[t],week:WEEKS[w]};
}

/* ---------- 儲存 ---------- */
var KEY="speak365.v1";
var S={name:"Miles",rate:0.95,voiceA:"",voiceB:"",done:{},style:"casual"};
try{var raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function fill(s){return s.replace(/\{name\}/g,S.name||"Alex");}
function todayStr(dt){dt=dt||new Date();return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function nextDay(){for(var d=1;d<=365;d++)if(!S.done[d])return d;return 365;}
function doneCount(){return Object.keys(S.done).length;}
function streak(){
  var dates={};Object.keys(S.done).forEach(function(k){dates[S.done[k].date]=1;});
  var n=0,dt=new Date();
  if(!dates[todayStr(dt)])dt.setDate(dt.getDate()-1);
  while(dates[todayStr(dt)]){n++;dt.setDate(dt.getDate()-1);}
  return n;
}
function avgScore(){var k=Object.keys(S.done);if(!k.length)return 0;var s=0;k.forEach(function(x){s+=S.done[x].score||0;});return Math.round(s/k.length);}

/* ---------- 工具 ---------- */
var $app=document.getElementById("app"),$dock=document.getElementById("dock");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2600);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
var IC={
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  rec:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>',

function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i];}for(var j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
var CONFUSE=/^(lr|rl|vw|wv|vb|bv|nl|ln)$/;
function confusable(a,b){if(a.length!==b.length)return false;var d=[];for(var i=0;i<a.length;i++)if(a[i]!==b[i])d.push(a[i]+b[i]);return d.length===1&&CONFUSE.test(d[0]);}
function same(a,b){return a===b||(a.length>=4&&b.length>=4&&lev(a,b)<=1&&!confusable(a,b))||(a+"s"===b)||(b+"s"===a);}
function compare(target,heard){
  // 回傳 {score, marks:[{w:原詞, ok:bool}]}
  var display=fill(target).split(/\s+/);
  var nameToks=norm(S.name||"");
  var tokMap=[],tgt=[];
  display.forEach(function(w,i){norm(w).forEach(function(t){tgt.push(t);tokMap.push(i);});});
  var h=norm(heard);
  var m=tgt.length,n=h.length,L=[];
  for(var i=0;i<=m;i++){L[i]=new Array(n+1).fill(0);}
  for(i=m-1;i>=0;i--)for(var j=n-1;j>=0;j--)L[i][j]=same(tgt[i],h[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  var hit=new Array(m).fill(false);i=0;j=0;
  while(i<m&&j<n){if(same(tgt[i],h[j])){hit[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  tgt.forEach(function(t,k){if(nameToks.indexOf(t)>=0)hit[k]=true;});
  var okCount=hit.filter(Boolean).length;
  var extra=Math.max(0,n-okCount);
  var score=m?Math.round(100*okCount/m-Math.min(15,extra*3)):0;
  score=Math.max(0,Math.min(100,score));
  var wordOk=display.map(function(){return null;});
  tokMap.forEach(function(wi,k){wordOk[wi]=(wordOk[wi]===null?true:wordOk[wi])&&hit[k];});
  return{score:score,ratio:m?okCount/m:0,total:m,extra:extra,marks:display.map(function(w,i){return{w:w,ok:wordOk[i]!==false};})};
}
function bestOf(target,alts){var best={score:-1,marks:[],heard:""};alts.forEach(function(a){var r=compare(target,a);if(r.score>best.score){best=r;best.heard=a;}});return best;}
function scoreClass(s){return s>=85?"good":s>=60?"mid":"low";}
function scoreWord(s){return s>=95?"太完美了！":s>=85?"很棒，發音清楚！":s>=60?"不錯，照下面的建議再練一次":"再慢一點、清楚一點試試";}
function grade(s){return s>=95?"S":s>=85?"A":s>=70?"B":"C";}
function gradeHTML(s){var g=grade(s);return'<span class="grade g'+g+'">'+g+'</span>';}

/* ---------- 發音建議 ---------- */
var FUNC_W=["a","an","the","to","of","for","and","is","are","am","in","on","at","it","do","be","was","you","my","me","some","with","from","this","that","can","will","have","has"];
function cleanW(w){return w.toLowerCase().replace(/[^a-z']/g,"").replace(/'/g,"");}
function diffPair(a,b){
  if(a.length!==b.length||a===b)return null;
  var d=[];for(var i=0;i<a.length;i++)if(a[i]!==b[i])d.push(a[i]+b[i]);
  return d.length===1?d[0]:null;
}
function tipsFor(target,res){
  var tips=[];
  if(!res.heard||!res.heard.trim())return[{h:"沒有聽到聲音",b:"靠近手機麥克風，按下後等半秒再開口，說完停一下讓它自動結束。"}];
  if(res.score>=95)return[];
  var miss=res.marks.filter(function(m){return!m.ok;}).map(function(m){return cleanW(m.w);}).filter(Boolean);
  var heardT=norm(res.heard);
  var used={};
  function add(key,h,b){if(!used[key]&&tips.length<3){used[key]=1;tips.push({h:h,b:b});}}
  if(miss.length&&miss.length>=Math.ceil(res.marks.length*0.5)){
    var ws=fill(target).split(/\s+/),half=Math.ceil(ws.length/2);
    add("chunk","一半以上沒被聽懂","先按「慢速」聽一次，把句子切成兩段練：「"+ws.slice(0,half).join(" ")+"」／「"+ws.slice(half).join(" ")+"」，熟了再整句連起來。");
  }
  var th=miss.filter(function(w){return/th/.test(w);});
  if(th.length)add("th","TH 音："+th.join("、"),"舌尖輕放在上下門牙之間吹氣。think 不是 sink，this 不是 dis。");
  miss.forEach(function(w){
    heardT.forEach(function(h){
      var p=diffPair(w,h);if(!p)return;
      if(p==="lr"||p==="rl")add("lr","L／R："+w+"（聽成 "+h+"）","R 舌頭往後捲、不碰上顎；L 舌尖頂住上排牙齒後面。");
      else if(/^(vw|wv|vb|bv)$/.test(p))add("vw","V 音："+w+"（聽成 "+h+"）","上排牙齒輕咬下唇再出聲，V 會有震動感；W 是嘟嘴不碰牙齒。");
      else if(/^(nl|ln)$/.test(p))add("nl","N／L："+w+"（聽成 "+h+"）","N 是鼻音，捏住鼻子會發不出來；L 從舌頭兩側出氣。");
      else if(/^(ei|ie|ae|ea)$/.test(p))add("vowel","母音："+w+"（聽成 "+h+"）","這個字的母音不太準，按「慢速」聽這個字，嘴型張大一點跟著念三次。");
    });
  });
  var ed=miss.filter(function(w){return/ed$/.test(w)&&w.length>3;});
  if(ed.length)add("ed","過去式 -ed："+ed.join("、"),"字尾的 -ed 要念出來（t／d／id 的音），不然會被聽成現在式。");
  var s=miss.filter(function(w){return/[^s]s$/.test(w)&&w.length>3&&heardT.indexOf(w.slice(0,-1))>=0;});
  if(s.length)add("s","字尾 S："+s.join("、"),"複數和第三人稱的 s 要清楚發出「ㄙ」或「ㄗ」的音。");
  var fin=miss.filter(function(w){return/[dtkgpb]$/.test(w)&&!/ed$/.test(w)&&w.length>2&&heardT.some(function(h){return h.length>=2&&w.indexOf(h)===0&&h!==w;});});
  if(fin.length)add("final","字尾子音："+fin.join("、"),"字尾的 d、t、k 不要吞掉，輕輕收乾淨，例如 made 不是 may。");
  var fw=miss.filter(function(w){return FUNC_W.indexOf(w)>=0;});
  if(fw.length)add("func","小字漏掉了："+fw.join("、"),"a、the、to 這類小字要輕輕帶過但不能省略，把它和下一個字連在一起念。");
  if((res.extra||0)>=4)add("extra","多說了一些字","照著句子說就好，先求準確，再求自然。");
  var rest=miss.filter(function(w){return!used.any;});
  if(!tips.length&&rest.length)add("generic","要加強："+rest.slice(0,4).join("、"),"按「慢速」仔細聽這幾個字，跟著念三次，再試整句。");
  return tips;
}
function tipsHTML(tips){
  if(!tips||!tips.length)return"";
  return'<div class="tips">'+tips.map(function(t){return'<div class="tipitem"><b>'+esc(t.h)+'</b><span>'+esc(t.b)+'</span></div>';}).join("")+'</div>';
}

/* ---------- 自由開口分析 ---------- */
var CONNECT=["because","so","but","and then","i think","actually","also","for example","when","if","after","before","first","then","finally","really","usually","maybe"];
function freeAnalyze(text,secs,hints){
  var toks=norm(text),words=toks.length,joined=" "+toks.join(" ")+" ";
  var wpm=secs>=10?Math.round(words/(secs/60)):0;
  var usedP=[];hints.forEach(function(p){[p[0],p[2]].some(function(t){if(!t)return false;var r=compare(t,text);if(r.total>=3&&r.ratio>=0.75){usedP.push([t]);return true;}return false;});});
  var conns=CONNECT.filter(function(c){return joined.indexOf(" "+c+" ")>=0;});
  var score=Math.min(40,Math.round(words/60*40))+Math.min(20,Math.round(secs/30*20))+Math.min(20,usedP.length*10)+Math.min(20,conns.length*5);
  if(!words)score=0;
  var tips=[];
  if(!words)tips.push({h:"沒有辨識到內容",b:"靠近麥克風再說一次；如果一直失敗，可以用「錄音回放」自己聽，再給自己打星星。"});
  else{
    if(words<30)tips.push({h:"再多說一點（"+words+" 個字）",b:"每個重點後面加一句原因或例子，例如 because…、for example…，目標 60 個字以上。"});
    if(secs>10&&wpm<70)tips.push({h:"停頓比較多（每分鐘 "+wpm+" 字）",b:"先用中文想好三個重點再開口；卡住時可以說 well… 或 let me think… 爭取時間，不要停住。"});
    if(secs>=10&&wpm>170)tips.push({h:"說得太快（每分鐘 "+wpm+" 字）",b:"放慢到每分鐘 110–150 字，句子之間停半拍，對方比較聽得懂。"});
    if(conns.length<2)tips.push({h:"句子之間少了連接詞",b:"試著用 I think…、because…、so…、and then… 把句子串起來，聽起來會更流暢。"});
    if(!usedP.length&&hints.length)tips.push({h:"用上本週的句子",b:"例如：「"+fill(hints[0][2]||hints[0][0])+"」把這週學的句子放進你的回答裡。"});
    if(!tips.length)tips.push({h:"表現很好！",b:"內容長度、速度和連接詞都到位了，下次試著說滿一分鐘。"});
  }
  return{score:Math.max(0,Math.min(100,score)),words:words,secs:secs,wpm:wpm,used:usedP.map(function(p){return fill(p[0]);}),conns:conns,tips:tips.slice(0,3)};
}

/* ---------- 錯題本與週報資料 ---------- */
function recordResult(en,zh,score,marks,day){
  if(!en)return;
  S.mist=S.mist||{};S.wlog=S.wlog||{};
  var k=fill(en);
  if(score<60){var m=S.mist[k]||{zh:fill(zh),n:0};m.n++;m.t=todayStr();S.mist[k]=m;}
  else if(score>=85&&S.mist[k])delete S.mist[k];
  if(day>0&&marks){
    var w=Math.min(51,Math.floor((day-1)/7)),log=S.wlog[w]||(S.wlog[w]={});
    marks.forEach(function(x){if(!x.ok){var c=cleanW(x.w);if(c)log[c]=(log[c]||0)+1;}});
  }
}
function mistList(){S.mist=S.mist||{};return Object.keys(S.mist).map(function(k){return{en:k,zh:S.mist[k].zh,n:S.mist[k].n};}).sort(function(a,b){return b.n-a.n;});}
function weekStats(w){
  var sum=0,n=0;for(var d=w*7+1;d<=w*7+7;d++)if(S.done[d]){sum+=S.done[d].score||0;n++;}
  return{n:n,avg:n?Math.round(sum/n):null};
}
function weekReportHTML(w){
  var cur=weekStats(w);if(!cur.n)return"";
  var prev=null;for(var p=w-1;p>=0;p--){var ps=weekStats(p);if(ps.n){prev=ps;break;}}
  var log=(S.wlog||{})[w]||{},top=Object.keys(log).sort(function(a,b){return log[b]-log[a];}).slice(0,5);
  var diff=prev&&prev.avg!=null?cur.avg-prev.avg:null;
  var h='<section class="report"><div class="sec-h"><h3>第 '+(w+1)+' 週週報</h3><span class="muted" style="font-size:13px">'+esc(WEEKS[w].t)+'</span></div>';
  h+='<div class="rep-row"><div class="rep-grade">'+gradeHTML(cur.avg)+'</div><div class="rep-stats">';
  h+='<div><b>'+cur.n+'/7</b><span>完成天數</span></div><div><b>'+cur.avg+'</b><span>平均分數</span></div>';
  h+='<div><b class="'+(diff==null?"":diff>=0?"up":"down")+'">'+(diff==null?"—":(diff>=0?"+":"")+diff)+'</b><span>比上週</span></div></div></div>';
  h+=top.length?'<div class="tip" style="margin-top:10px">這週最常錯的字：'+top.map(function(x){return'<span class="wtag">'+esc(x)+' ×'+log[x]+'</span>';}).join(" ")+'</div>':'<div class="tip" style="margin-top:10px">這週沒有特別常錯的字，很穩！</div>';
  return h+'</section>';
}

/* ---------- 錄音 ---------- */
var mediaRec=null,recChunks=[],recStream=null;
function canRecord(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function startRec(){
  recUsed=true;recSession();
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    recStream=st;recChunks=[];
    var type=["audio/webm","audio/mp4","audio/aac"].find(function(t){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t);});
    mediaRec=type?new MediaRecorder(st,{mimeType:type}):new MediaRecorder(st);
    mediaRec.ondataavailable=function(e){if(e.data.size)recChunks.push(e.data);};
    mediaRec.start();
  });
}
function stopRec(){
  return new Promise(function(res){
    if(!mediaRec||mediaRec.state==="inactive")return res(null);
    mediaRec.onstop=function(){var b=new Blob(recChunks,{type:mediaRec.mimeType||"audio/mp4"});recStream.getTracks().forEach(function(t){t.stop();});mediaRec=null;res(URL.createObjectURL(b));};
    mediaRec.stop();
  });
}

/* ---------- 長時間語音轉文字（自由開口） ---------- */
var longStop=null;
function startLong(onText,onEnd){
  var finals="",stopped=false,ended=false,cur=null,quick=0,anyText=false,quietT=null;
  function end(err,silent){if(ended)return;ended=true;longStop=null;clearTimeout(quietT);if((err==="no-sound"||err==="no-start")&&!anyText){S.micMode=(micMode()+1)%3;save();}if(!silent)logSR({t:new Date().toTimeString().slice(0,8),m:micMode(),tts:-1,rec:recUsed,as:navigator.audioSession?navigator.audioSession.type:"-",ev:["自由開口"],out:err||(anyText?"ok":"empty")});if(cur){var c=cur;cur=null;c.onresult=c.onerror=c.onend=null;try{c.abort();}catch(e){}}if(!silent)onEnd(finals.trim(),err);}
  function again(){if(++quick>=5){stopped=true;end("no-start");}else setTimeout(run,300);}
  function run(){
    if(stopped||ended)return end();
    recSession();
    var r,t0=Date.now(),got=false;
    try{r=new SR();}catch(e){return end("start-failed");}
    cur=r;r.lang="en-US";r.continuous=true;r.interimResults=true;
    r.onresult=function(e){if(cur!==r)return;got=true;quick=0;anyText=true;clearTimeout(quietT);var interim="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finals+=e.results[i][0].transcript+" ";else interim+=e.results[i][0].transcript;}onText((finals+interim).trim());};
    r.onerror=function(e){if(cur!==r)return;if(e.error==="not-allowed"||e.error==="service-not-allowed"){stopped=true;end(e.error);}};
    // iPhone 停頓後會自己結束，沒按停止就自動接著聽；一直秒退就停下來回報
    r.onend=function(){if(cur!==r)return;cur=null;if(stopped)return end();if(!got&&Date.now()-t0<1500)again();else setTimeout(run,250);};
    try{r.start();}catch(x){cur=null;again();}
  }
  prepAudio().then(function(){run();quietT=setTimeout(function(){if(!anyText&&!ended){stopped=true;end("no-sound");}},5000);});
  longStop=function(silent){if(silent)return end(null,true);stopped=true;if(cur){try{cur.stop();}catch(e){}setTimeout(function(){end();},1500);}else end();};
}

/* ---------- 課本／口語說法 ---------- */
function casW(w){var c=window.CASUAL&&window.CASUAL[w];return c&&c.p&&c.d?c:null;}
function phr(w,i){var x=WEEKS[w].p[i],c=casW(w),cp=c&&c.p[i];return{en:x[0],zh:x[1],c:cp?cp[0]:"",note:cp?cp[1]:""};}
function isCas(){return S.style!=="book";}
function pick(book,cas){return isCas()&&cas?cas:book;}
var PMAP=null,PMAPN="";
function lookupPhrase(en){
  if(!PMAP||PMAPN!==S.name){PMAP={};PMAPN=S.name;WEEKS.forEach(function(W,w){W.p.forEach(function(x,i){var o=phr(w,i);PMAP[fill(o.en)]=o;if(o.c)PMAP[fill(o.c)]=o;});var c=casW(w);W.d.l.forEach(function(x,i){if(x[0]!=="B")return;var o={en:x[1],zh:x[2],c:c?c.d[i]:"",note:""};if(!PMAP[fill(o.en)])PMAP[fill(o.en)]=o;if(o.c&&!PMAP[fill(o.c)])PMAP[fill(o.c)]=o;});});}
  return PMAP[fill(en)]||null;
}
function fromMist(x){var o=lookupPhrase(x.en);return o?{en:o.en,zh:o.zh,c:o.c,note:o.note,mist:true}:{en:x.en,zh:x.zh,mist:true};}
function styleSegHTML(){return'<div class="seg" role="group" aria-label="說法"><button data-style="book" class="'+(isCas()?"":"on")+'">課本說法</button><button data-style="casual" class="'+(isCas()?"on":"")+'">美式口語</button></div>';}

/* ---------- 建立當天的練習卡 ---------- */
function buildItems(info){
  var wk=info.week,p=wk.p,items=[],r=rng(info.d*97);
  switch(info.type.k){
    case "learn":
      var st0=info.t===0?0:4;for(var q=st0;q<st0+4;q++){var o=phr(info.w,q);o.k="shadow";items.push(o);}
      break;
    case "recall":
      shuffle(p.map(function(x,q){return phr(info.w,q);}),r).forEach(function(o){o.k="recall";items.push(o);});
      break;
    case "listen":
      var cw=casW(info.w);
      items.push({k:"dialog",d:wk.d,cl:cw?cw.d:[]});
      wk.d.l.forEach(function(x,q){items.push({k:"shadow",en:x[1],zh:x[2],c:cw?cw.d[q]:"",who:x[0]==="A"?wk.d.a:"你"});});
      break;
    case "roleplay":
      var cr=casW(info.w);for(var i=0;i<wk.d.l.length;i+=2)items.push({k:"role",a:wk.d.l[i],b:wk.d.l[i+1],ac:cr?cr.d[i]:"",c:cr?cr.d[i+1]:"",en:wk.d.l[i+1][1],zh:wk.d.l[i+1][2],aName:wk.d.a,scene:wk.d.s});
      break;
    case "free":
      items.push({k:"free",prompt:wk.f,hints:p.map(function(x,q){var o=phr(info.w,q);return[o.en,o.zh,o.c];})});
      break;
    case "review":
      var pool=mistList().slice(0,3).map(fromMist);
      var seen={};pool.forEach(function(x){seen[fill(x.en)]=1;});
      shuffle(p.map(function(x,q){return phr(info.w,q);}),r).forEach(function(o){if(pool.length<6&&!seen[fill(o.en)]){pool.push(o);seen[fill(o.en)]=1;}});
      var past=[];for(var w=0;w<info.w;w++)WEEKS[w].p.forEach(function(x,q){past.push(phr(w,q));});
      if(!past.length)past=p.map(function(x,q){return phr(info.w,q);});
      shuffle(past,r).forEach(function(x){if(pool.length<8&&!seen[fill(x.en)]){pool.push(x);seen[fill(x.en)]=1;}});
      shuffle(pool,r).forEach(function(x){x.k="recall";items.push(x);});
      break;
    case "grad":
      var all=[];WEEKS.forEach(function(W,w){W.p.forEach(function(x,q){all.push(phr(w,q));});});
      mistList().slice(0,3).forEach(function(x){var o=fromMist(x);o.k="recall";items.push(o);});
      shuffle(all,r).slice(0,8-items.length).forEach(function(o){o.k="recall";items.push(o);});
      items.push({k:"free",prompt:"畢業演講：用兩分鐘說出你這 365 天學英文的故事——一開始怎樣、中間最難的是什麼、現在能做到什麼。",hints:WEEKS[51].p.map(function(x,q){var o=phr(51,q);return[o.en,o.zh,o.c];})});
      break;
  }
  return items;
}

/* ---------- 練習流程 ---------- */

function openMistakes(){

}
function curItem(){return L.items[L.i];}

  h+='<div class="lesson-title"><div class="eyebrow">'+(info.d?'Day '+info.d+' · ':'')+esc(info.type.n)+'</div><h2>'+esc(info.week.t)+'</h2>'+(it.k!=="free"?styleSegHTML():'')+'</div>'+envBannerHTML();

      h+='<div class="metrics"><div><b>'+a.words+'</b><span>字數</span></div><div><b>'+(a.wpm||"—")+'</b><span>每分鐘字數</span></div><div><b>'+a.used.length+'</b><span>本週句子</span></div><div><b>'+a.conns.length+'</b><span>連接詞</span></div></div>';
      if(a.used.length)h+='<div class="tip">用到的本週句子：'+a.used.map(esc).join("／")+'</div>';

    if(a||st.url){

function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function targetOf(it){return pick(it.en,it.c);}
function altOf(it){return it.c?(targetOf(it)===it.c?it.en:it.c):"";}
function zhOf(it){return it.zh;}
function bindCard(it,st){
  var c=document.getElementById("card");
  c.querySelectorAll("[data-say]").forEach(function(b){b.onclick=function(){b.classList.add("on");speak(targetOf(it),{slow:b.dataset.say==="s",b:it.k==="role"||it.who==="你"}).then(function(){b.classList.remove("on");});};});
  var rv=document.getElementById("reveal");if(rv)rv.onclick=function(){st.reveal=true;renderItem();};
  var sa=document.getElementById("sayA");if(sa)sa.onclick=function(){speak(pick(it.a[1],it.ac));};
  var rec=c.querySelector("[data-rec]");
  if(rec){var label=rec.innerHTML;rec.onclick=function(){
    if(longStop){toast("請先停止說話評分，再錄音");return;}
    if(mediaRec){stopRec().then(function(url){rec.classList.remove("on");rec.innerHTML=label;if(url){if(it.k==="free")st.url=url;document.getElementById("myrec").innerHTML='<audio controls src="'+url+'" style="width:100%"></audio>';if(it.k==="free"&&!document.getElementById("stars"))renderItem();}});}
    else startRec().then(function(){rec.classList.add("on");rec.innerHTML=IC.stop+"停止錄音";}).catch(function(){toast("無法使用麥克風，請在瀏覽器設定允許麥克風");});
  };}
  if(it.k==="dialog"){
    var playing=false;
    var playAll=function(slow){
      if(playing){playing=false;hush();return;}
      playing=true;var i=0;
      (function next(){
        c.querySelectorAll(".line").forEach(function(el){el.classList.remove("now");});
        if(!playing||i>=it.d.l.length){playing=false;return;}
        var el=c.querySelector('[data-line="'+i+'"]');el.classList.add("now");el.scrollIntoView({block:"nearest",behavior:"smooth"});
        var x=it.d.l[i];speak(pick(x[1],it.cl[i]),{slow:slow,b:x[0]==="B"}).then(function(){i++;setTimeout(next,350);});
      })();
    };
    document.getElementById("playall").onclick=function(){playAll(false);};
    document.getElementById("playslow").onclick=function(){playAll(true);};
  }
  if(it.k==="free")c.querySelectorAll("[data-star]").forEach(function(b){b.onclick=function(){st.stars=+b.dataset.star;renderItem();};});
  if(it.k==="role"&&!st.autoplayed){st.autoplayed=true;speak(pick(it.a[1],it.ac));}
}
function renderDock(it,st){
  var last=L.i===L.items.length-1;

  var h='<div class="dock"><div class="dock-in">';
  if(it.k!=="dialog")h+='<div><button class="mic" id="mic" aria-label="'+(it.k==="free"?"開始說話":"開始說")+'">'+IC.mic+'</button></div>';
  h+='<button class="btn '+(canNext?"primary":"ghost")+'" id="next">'+(last?(L.custom?"完成":"完成今天"):(canNext?"下一個":"跳過"))+'</button>';

  $dock.innerHTML=h;
  document.getElementById("next").onclick=function(){
    if(it.k==="free"&&!canNext){toast("先按麥克風說一段話，或錄音後給自己打分");return;}
    if(!canNext&&it.k!=="dialog"){st.skipped=true;st.score=0;}

  };
  var mic=document.getElementById("mic");
  if(!mic)return;
  if(it.k==="free"){
    mic.onclick=function(){
      if(longStop){longStop();return;}

      if(!SR){toast("這個瀏覽器不支援語音辨識，請用「錄音回放」後自己打分");return;}

    listen(function(t){var el=document.getElementById("interim");if(el)el.textContent=t;},function(){var h=document.getElementById("hearing");if(h&&h.firstChild)h.firstChild.textContent="請開始說 🎙";if(navigator.vibrate)navigator.vibrate(15);}).then(function(alts){
      if(!alts.length)toast("沒有聽到聲音。按下麥克風後等半秒再開口；若一直這樣，請到設定做語音診斷。");
      var A=alts.length?alts:[""],target=targetOf(it),best=bestOf(target,A),other=altOf(it),altHit="";
      if(other){var b2=bestOf(other,A);if(b2.score>best.score+4){best=b2;target=other;altHit=other===it.c?"c":"b";}}
      st.tries=(st.tries||0)+1;st.lastScore=best.score;
      if(st.score==null||best.score>=st.score){st.score=best.score;st.marks=best.marks;st.heard=best.heard;st.tips=tipsFor(target,best);st.target=target;st.altHit=altHit;}
      renderItem();
      if(best.score>=85&&navigator.vibrate)navigator.vibrate(30);
    }).catch(function(err){
      mic.classList.remove("live");mic.innerHTML=IC.mic;
      res.innerHTML="";
      if(err==="aborted")return;
      toast(err==="unsupported"?envWarning()||"這個瀏覽器不支援語音辨識":srErrMsg(err));
    });
  };
}
function advance(){
  var st=L.state[L.i],it=curItem();
  if(it.k==="free"){
    var a=st.analysis,sc=a?(st.stars?Math.round(a.score*0.8+st.stars*20*0.2):a.score):(st.stars||0)*20;
    L.scores.push(sc);
  }else if(it.k!=="dialog"){
    L.scores.push(st.score||0);
    if(!st.skipped)recordResult(st.target||targetOf(it),zhOf(it),st.score||0,st.marks,L.info.d);
    if(!st.skipped&&st.score!=null&&st.score<85)(L.weak=L.weak||[]).push({en:fill(st.target||targetOf(it)),score:st.score,tip:(st.tips||[])[0]});
  }
  save();
  if(L.i<L.items.length-1){L.i++;renderItem();}
  else finish();
}
function finish(){
  stopAll();

  var d=L.info.d,grad=d===365;

  if(!L.custom)h+='<p class="muted">連續 '+streak()+' 天 · 已完成 '+doneCount()+' / 365 天</p>';
  else h+='<p class="muted">錯題本還剩 '+mistList().length+' 句</p>';
  h+='</div>';
  var weak=(L.weak||[]).sort(function(a,b){return a.score-b.score;}).slice(0,3);
  if(weak.length){
    h+='<section class="report"><div class="sec-h"><h3>今天最需要加強的句子</h3></div>';
    weak.forEach(function(w){h+='<div class="weak"><div><b>'+esc(w.en)+'</b> <span class="muted">'+w.score+' 分</span></div>'+(w.tip?'<div class="tip">'+esc(w.tip.h)+'：'+esc(w.tip.b)+'</div>':'')+'</div>';});
    h+='</section>';
  }
  if(!L.custom&&d<365&&L.info.t===6)h+=weekReportHTML(L.info.w);
  if(!L.custom&&!grad)h+='<p class="tip" style="text-align:center">下一堂：Day '+nd+'「'+esc(dayInfo(nd).week.t)+'」· '+esc(dayInfo(nd).type.n)+'</p>';
  $app.innerHTML=h;
  $dock.innerHTML='<div class="dock"><div class="dock-in"><button class="btn ghost" id="again">再練一次</button><button class="btn primary" id="home">回首頁</button></div></div>';
  document.getElementById("home").onclick=renderHome;
  document.getElementById("again").onclick=function(){if(L.custom)openMistakes();else openLesson(d);};
  window.scrollTo(0,0);
}

/* ---------- 設定 ---------- */
function renderSettings(){
  stopAll();loadVoices();
  var opts=function(sel){return'<option value="">自動選擇</option>'+voices.map(function(v){return'<option '+(v.name===sel?"selected":"")+'>'+esc(v.name)+'</option>';}).join("");};
  var h='<div class="lesson-top"><button class="iconbtn" id="back" aria-label="回首頁">'+IC.back+'</button><h2 style="font-size:20px">設定</h2></div>';
  h+='<div class="field"><label for="nm">你的英文名字（課文中的 {name} 會換成它）</label><input id="nm" value="'+esc(S.name)+'" autocomplete="off"></div>';
  h+='<div class="field"><label for="rt">朗讀速度：<span id="rtv">'+S.rate.toFixed(2)+'</span></label><input id="rt" type="range" min="0.6" max="1.2" step="0.05" value="'+S.rate+'"></div>';
  h+='<div class="field"><label for="va">主要聲音（美式）</label><select id="va">'+opts(S.voiceA)+'</select></div>';
  h+='<div class="field"><label for="vb">對話中「你」的聲音</label><select id="vb">'+opts(S.voiceB)+'</select></div>';
  h+='<div class="row" style="margin-bottom:24px"><button class="pill" id="test">'+IC.play+'試聽</button></div>';
  h+='<div class="sec-h"><h3>備份進度</h3></div><p class="tip" style="margin-top:0">進度只存在這支手機的瀏覽器裡。換手機或清除瀏覽資料前，先複製備份碼存起來。</p>';
  h+='<div class="field"><textarea id="bk" aria-label="備份碼">'+esc(JSON.stringify({v:2,name:S.name,done:S.done,mist:S.mist||{},wlog:S.wlog||{}}))+'</textarea></div>';
  h+='<div class="row" style="margin-bottom:24px"><button class="pill" id="copy">複製備份碼</button><button class="pill" id="restore">用上面的備份碼還原</button></div>';
  h+='<div class="sec-h"><h3>語音診斷</h3></div><p class="tip" style="margin-top:0">麥克風或朗讀不能用時，依序按下面三個按鈕，把結果截圖給我。</p>';
  h+='<div class="row" style="margin-bottom:10px"><button class="pill" id="dEnv">1. 環境檢查</button><button class="pill" id="dTts">2. 測試朗讀</button><button class="pill" id="dSr">3. 測試辨識</button></div><pre class="diaglog" id="dLog">'+esc(envWarning()||"按上面的按鈕開始檢查")+'</pre>';
  h+='<div class="field" style="margin-top:14px"><label for="mm">麥克風模式（收不到聲音時會自動切換）</label><select id="mm">'+MIC_MODES.map(function(n,i){return'<option value="'+i+'"'+(micMode()===i?' selected':'')+'>'+n+'</option>';}).join("")+'</select></div>';
  h+='<div class="tip">最近幾次麥克風紀錄（收不到聲音時請截圖給我）</div><pre class="diaglog" id="srLog">'+esc(srLogText())+'</pre>';
  h+='<div class="note"><b>iPhone 必要設定</b><br>1. 用 <b>Safari</b> 開啟網址（不要用 LINE 裡的瀏覽器或 Chrome）<br>2. 設定 → Siri：開啟 Siri<br>3. 設定 → 一般 → 鍵盤：開啟「聽寫」，並在「鍵盤」裡加入「英文（美國）」<br>4. 設定 → Safari → 麥克風：允許<br>5. 側邊靜音開關打開時，朗讀會沒有聲音</div>';
  h+='<div style="margin-top:24px"><button class="pill" id="reset" style="color:var(--bad)">清除所有進度</button></div>';
  $app.innerHTML=h;$dock.innerHTML="";
  document.getElementById("back").onclick=renderHome;
  document.getElementById("nm").oninput=function(e){S.name=e.target.value.trim()||"Alex";save();};
  document.getElementById("rt").oninput=function(e){S.rate=+e.target.value;document.getElementById("rtv").textContent=S.rate.toFixed(2);save();};
  document.getElementById("va").onchange=function(e){S.voiceA=e.target.value;save();};
  document.getElementById("vb").onchange=function(e){S.voiceB=e.target.value;save();};
  var dl=document.getElementById("dLog");
  document.getElementById("mm").onchange=function(e){S.micMode=+e.target.value;save();toast("已換成「"+MIC_MODES[S.micMode]+"」模式");};
  document.getElementById("dEnv").onclick=function(){dl.textContent="";runDiag("env",dl);};
  document.getElementById("dTts").onclick=function(){dl.textContent="";runDiag("tts",dl);};
  document.getElementById("dSr").onclick=function(){dl.textContent="";runDiag("sr",dl);};
  document.getElementById("test").onclick=function(){speak("Hi, I'm your speaking partner. Let's practice together!");};
  document.getElementById("copy").onclick=function(){var t=document.getElementById("bk");var ok=function(){toast("已複製備份碼");};if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,function(){t.select();toast("請長按選取後複製");});else{t.select();toast("請長按選取後複製");}};
  document.getElementById("restore").onclick=function(){try{var o=JSON.parse(document.getElementById("bk").value);if(!o.done)throw 0;S.done=o.done;if(o.name)S.name=o.name;if(o.mist)S.mist=o.mist;if(o.wlog)S.wlog=o.wlog;save();toast("已還原 "+Object.keys(S.done).length+" 天的進度");}catch(e){toast("備份碼格式不對，請重新貼上完整內容");}};
  var armed=false;document.getElementById("reset").onclick=function(e){if(!armed){armed=true;e.target.textContent="再按一次確認清除";setTimeout(function(){armed=false;e.target.textContent="清除所有進度";},3000);return;}S.done={};S.mist={};S.wlog={};save();toast("已清除進度");renderHome();};
  window.scrollTo(0,0);
}

renderHome();
})();
</script>
</body>
</html>
